services:
  - type: web
    name: emotional-ai-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k gthread --threads 4 --timeout 60 --graceful-timeout 20 --keep-alive 5 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEYS
        sync: false
      - key: LOW_QUOTA_MODE
        value: "0"
      - key: PYTHON_VERSION
        value: 3.12.7
